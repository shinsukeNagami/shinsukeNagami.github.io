<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST National Exam Drill System</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #FFFDF8;
    color: #111111;
    overflow: hidden;
  }
  #appFrame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    background: #FFFDF8;
  }
  #bootOverlay {
    position: fixed;
    inset: 0;
    background: #FFFDF8;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .boot-card {
    background: #FFFFFF;
    border: 3px solid #FF8247;
    border-radius: 16px;
    padding: 28px 32px;
    box-shadow: 0 10px 28px rgba(232, 85, 53, 0.16);
    text-align: center;
    max-width: 480px;
    width: 100%;
  }
  .boot-title {
    font-size: 19px;
    font-weight: 900;
    color: #E85535;
    margin-bottom: 10px;
  }
  .boot-msg {
    font-size: 14.5px;
    color: #5C4940;
    font-weight: 700;
    margin-bottom: 14px;
    line-height: 1.6;
  }
  .progress-wrap {
    width: 100%;
    height: 10px;
    background: #FFF3EA;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid #F3D1C0;
    margin-bottom: 10px;
  }
  .progress-bar {
    height: 100%;
    width: 15%;
    background: linear-gradient(90deg, #FF6542, #FFB340);
    transition: width 0.25s ease;
  }
  .key-box {
    display: none;
    margin-top: 12px;
    gap: 8px;
    flex-direction: column;
  }
  .key-input {
    padding: 10px 12px;
    border: 2px solid #F3D1C0;
    border-radius: 8px;
    font-size: 14px;
    width: 100%;
  }
  .key-btn {
    padding: 10px 16px;
    background: #E85535;
    color: #FFF;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
<iframe id="appFrame" title="ST Drill App"></iframe>
<div id="bootOverlay">
  <div class="boot-card">
    <div class="boot-title">🍑 国試対策ドリル（Web版）</div>
    <div class="boot-msg" id="bootStatus">全21領域・7,587問＋5枠解説データを展開しています...</div>
    <div class="progress-wrap" id="bootProgWrap">
      <div class="progress-bar" id="bootProgBar"></div>
    </div>
    <div class="key-box" id="bootKeyBox">
      <input type="password" id="bootKeyInput" class="key-input" placeholder="専用アクセスキーを入力してください">
      <button class="key-btn" onclick="unlockWithManualKey()">開く</button>
    </div>
  </div>
</div>
<script>
const STORAGE_KEY_NAME = "st_reha_drill_access_k_v21";

function b64UrlToBytes(rawInput) {
  let clean = rawInput.trim();
  if (clean.startsWith("#")) clean = clean.substring(1);
  if (clean.startsWith("k=")) clean = clean.substring(2);
  let std = "";
  for (let i = 0; i < clean.length; i++) {
    const ch = clean.charAt(i);
    if (ch === "-") std += "+";
    else if (ch === "_") std += "/";
    else std += ch;
  }
  while (std.length % 4 !== 0) std += "=";
  const bin = atob(std);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return { bytes: out, token: clean };
}

async function decryptAndGunzip(encBuffer, cryptoKey) {
  const iv = new Uint8Array(encBuffer, 0, 12);
  const ciphertext = new Uint8Array(encBuffer, 12);
  const decryptedGz = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: iv },
    cryptoKey,
    ciphertext
  );
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([decryptedGz]).stream().pipeThrough(ds);
  return await new Response(stream).text();
}

async function bootAppWithKeyString(rawKeyStr) {
  const statusEl = document.getElementById("bootStatus");
  const progBar = document.getElementById("bootProgBar");
  const keyBox = document.getElementById("bootKeyBox");
  try {
    keyBox.style.display = "none";
    progBar.style.width = "25%";
    statusEl.textContent = "暗号化キーを検証し、問題データを読み込んでいます...";

    const parsed = b64UrlToBytes(rawKeyStr);
    if (parsed.bytes.length !== 32) {
      throw new Error("INVALID_KEY_LENGTH");
    }
    const cryptoKey = await crypto.subtle.importKey(
      "raw",
      parsed.bytes,
      { name: "AES-GCM" },
      false,
      ["decrypt"]
    );

    const [appRes, dataRes] = await Promise.all([
      fetch("app.enc", { cache: "force-cache" }),
      fetch("data.enc", { cache: "force-cache" })
    ]);
    if (!appRes.ok || !dataRes.ok) {
      throw new Error("FETCH_FAILED");
    }
    progBar.style.width = "65%";
    statusEl.textContent = "全7,587問・21領域データをブラウザ内で復号・展開しています...";

    const [appBuf, dataBuf] = await Promise.all([
      appRes.arrayBuffer(),
      dataRes.arrayBuffer()
    ]);

    const [uiHtmlStr, dataJsonStr] = await Promise.all([
      decryptAndGunzip(appBuf, cryptoKey),
      decryptAndGunzip(dataBuf, cryptoKey)
    ]);

    progBar.style.width = "95%";
    localStorage.setItem(STORAGE_KEY_NAME, parsed.token);

    window.__PRELOADED_DRILL_DATA = JSON.parse(dataJsonStr);
    const frame = document.getElementById("appFrame");
    frame.style.display = "block";
    frame.onload = function() {
      document.getElementById("bootOverlay").style.display = "none";
    };
    frame.srcdoc = uiHtmlStr;
  } catch (err) {
    statusEl.textContent = "専用リンク（URL末尾の#キー付き）からアクセスするか、アクセスキーを入力してください。";
    document.getElementById("bootProgWrap").style.display = "none";
    keyBox.style.display = "flex";
  }
}

function unlockWithManualKey() {
  const val = (document.getElementById("bootKeyInput").value || "").trim();
  if (!val) return;
  document.getElementById("bootProgWrap").style.display = "block";
  bootAppWithKeyString(val);
}

window.addEventListener("DOMContentLoaded", function() {
  const rawHash = window.location.hash || "";
  const hashKey = rawHash.startsWith("#") ? rawHash.substring(1).trim() : rawHash.trim();
  const savedKey = (localStorage.getItem(STORAGE_KEY_NAME) || "").trim();
  const activeKey = hashKey || savedKey;
  if (activeKey) {
    bootAppWithKeyString(activeKey);
  } else {
    document.getElementById("bootStatus").textContent = "配布された専用リンク（URL末尾の#キー付き）から開いてください。";
    document.getElementById("bootProgWrap").style.display = "none";
    document.getElementById("bootKeyBox").style.display = "flex";
  }
});
</script>
</body>
</html>
